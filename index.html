<style>

.sp{background:var(--sf);border-radius:var(--r);padding:20px;margin-top:16px;box-shadow:var(--sh)}.sr{margin-bottom:16px}.sr label{display:block;font-size:.8rem;font-weight:600;margin-bottom:6px;color:var(--tm)}.pg{display:flex;gap:6px;flex-wrap:wrap}.pi{padding:7px 16px;border:1.5px solid var(--bd);border-radius:20px;background:var(--sf);cursor:pointer;font-size:.8rem;font-weight:500;transition:all var(--t);color:var(--tx)}.pi:hover{border-color:var(--pr)}.pi.a{background:var(--pr);color:#fff;border-color:var(--pr)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 24px;border:none;border-radius:var(--rs);font-size:.88rem;font-weight:600;cursor:pointer;transition:all var(--t);font-family:var(--f)}.bp{background:var(--pr);color:#fff}.bp:hover{background:var(--pd);transform:translateY(-1px)}.bp:disabled{opacity:.4;cursor:not-allowed;transform:none}.bo{background:transparent;color:var(--pr);border:1.5px solid var(--pr)}.bo:hover{background:var(--pl)}.bg{display:flex;gap:8px;margin-top:20px;justify-content:center;flex-wrap:wrap}
.qt{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:6px}.qt .st{font-size:.73rem;font-weight:600;color:var(--pr);background:var(--pl);padding:3px 10px;border-radius:14px}.qt .qc{font-size:.82rem;font-weight:600;color:var(--tm)}.qt .tm{font-size:.82rem;font-weight:700;color:var(--wa);min-width:46px;text-align:right}
.pt{width:100%;height:5px;background:var(--sa);border-radius:3px;margin-bottom:20px;overflow:hidden}.pf{height:100%;background:var(--pr);border-radius:3px;transition:width .4s ease}
.qc2{background:var(--sf);border-radius:var(--r);padding:24px 20px;box-shadow:var(--sh)}.qtx{font-size:1rem;font-weight:600;line-height:1.5;margin-bottom:18px}
.ol{display:flex;flex-direction:column;gap:8px}.op{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border:1.5px solid var(--bd);border-radius:var(--rs);cursor:pointer;transition:all var(--t);background:var(--sf)}.op:hover:not(.dis){border-color:var(--pr);background:var(--pl)}.op.sel{border-color:var(--pr);background:var(--pl)}.op.cor{border-color:var(--ok);background:var(--ob)}.op.wrg{border-color:var(--no);background:var(--nb)}.op.dis{cursor:default;opacity:.85}.op.dis.cor{opacity:1}
.op .lt{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;flex-shrink:0;transition:all var(--t);color:var(--tm)}.op.sel .lt{background:var(--pr);color:#fff;border-color:var(--pr)}.op.cor .lt{background:var(--ok);color:#fff;border-color:var(--ok)}.op.wrg .lt{background:var(--no);color:#fff;border-color:var(--no)}.op .ot{font-size:.87rem;padding-top:2px;line-height:1.4}
.eb{margin-top:14px;padding:14px;background:var(--sa);border-radius:var(--rs);border-left:3px solid var(--pr);font-size:.83rem;line-height:1.5;color:var(--tm);animation:fu .3s ease}.eb strong{color:var(--tx);font-weight:600}
.qn{display:flex;justify-content:space-between;margin-top:16px;gap:8px}
.rh{text-align:center;padding:28px 16px;background:var(--sf);border-radius:var(--r);box-shadow:var(--sl);margin-bottom:20px}
.sring{width:130px;height:130px;margin:0 auto 12px;position:relative}.sring svg{transform:rotate(-90deg)}.sring .rb{fill:none;stroke:var(--sa);stroke-width:10}.sring .rf{fill:none;stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 1.2s ease}.scn{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.scn .pc{font-size:1.9rem;font-weight:800;line-height:1}.scn .of{font-size:.75rem;color:var(--tm);margin-top:2px}.rg{font-size:1.05rem;font-weight:700;margin-top:4px}.rs2{display:flex;justify-content:center;gap:24px;margin-top:12px;font-size:.8rem;color:var(--tm)}.rs2 span{display:flex;align-items:center;gap:4px}.dt{width:8px;height:8px;border-radius:50%;display:inline-block}.dt.g{background:var(--ok)}.dt.r{background:var(--no)}.dt.y{background:var(--wa)}
.rvh{font-size:.9rem;font-weight:700;margin:20px 0 12px}.rvi{background:var(--sf);border-radius:var(--rs);padding:14px;margin-bottom:8px;border-left:3px solid var(--bd)}.rvi.wc{border-left-color:var(--ok)}.rvi.ww{border-left-color:var(--no)}.rvi.ws{border-left-color:var(--wa)}.rvq{font-size:.85rem;font-weight:600;margin-bottom:6px;line-height:1.4}.rva{font-size:.8rem;color:var(--tm);line-height:1.45}.rva .tg{display:inline-block;font-size:.68rem;font-weight:700;padding:2px 7px;border-radius:4px;margin-right:4px}.tg.ct2{background:var(--ob);color:var(--ok)}.tg.wt{background:var(--nb);color:var(--no)}.tg.skt{background:#fef3c7;color:#92400e}.rve{font-size:.78rem;color:var(--tm);margin-top:4px;line-height:1.45;font-style:italic}
.tc{text-align:center}.hd{display:none!important}
@media(max-width:500px){.sg{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}.sc{padding:12px 8px}.qc2{padding:16px 14px}.qn{flex-direction:column}.qn .btn{width:100%}.app{padding:10px 8px 28px}}
</style>
</head>

<div class="app" id="app">
<div class="screen active" id="home-screen">

<div class="sp">

"sv":{n:"Surveying",ic:"📐",q:{
easy:[
{q:"Chain surveying principle is:",o:["Traversing","Triangulation","Radiation","Working whole to part"],c:1,e:"Area divided into triangles—plotted with side lengths alone."},
{q:"Gunter's chain length is:",o:["20 m","100 feet","66 feet","30 m"],c:2,e:"66 ft = 22 yards, 100 links of 0.66 ft each."},
{q:"Contour lines join points of equal:",o:["Slope","Bearing","Distance","Elevation"],c:3,e:"Closely spaced contours = steep terrain."},
{q:"WCB is measured clockwise from:",o:["South","Magnetic east","North","West"],c:2,e:"Whole Circle Bearing: 0°–360° clockwise from north."},
{q:"Levelling determines difference in:",o:["Bearing","Distance","Latitude","Elevation"],c:3,e:"Establishes height differences using a level instrument and staff."},
{q:"Theodolite measures:",o:["Distance only","Elevation only","Horizontal and vertical angles","Bearing only"],c:2,e:"Theodolite: precise angular measurement instrument."},
{q:"Benchmark is a point of known:",o:["Distance","Bearing","Latitude","Elevation"],c:3,e:"BMs have known RL above mean sea level—reference for levelling."},
{q:"Zero of a levelling staff is at its:",o:["Top","Middle","Bottom","Any point"],c:2,e:"Graduations begin from bottom (zero at base), reading upward."},
{q:"Prismatic compass reads:",o:["ReducedBearing directly","Only angles","Only distances","WCB directly"],c:3,e:"Prismatic compass: prism for reading WCB while sighting object."},
{q:"Offset is taken:",o:["Along chain line","Diagonally","At any angle","Perpendicular to chain line"],c:3,e:"Short perpendicular measurements from survey line to locate detail."},
{q:"Height of instrument (HI) =:",o:["RL of BM − BS","RL of BM × BS","BS − FS","RL of BM + BS"],c:3,e:"HI = RL + BS. Then RL of new point = HI − FS."},
{q:"Ranging establishes:",o:["Bearings","Areas","Volumes","Intermediate points on a straight line"],c:3,e:"Intermediate points placed between two endpoints using ranging rods."},
{q:"Metric chain of 20 m has links of:",o:["1 m","0.5 m","0.1 m","0.2 m"],c:3,e:"20 m chain: 100 links × 0.2 m each."},
{q:"Plane table surveying combines:",o:["Only measuring distances","Only angles","Only computing areas","Field work and plotting simultaneously"],c:3,e:"Map drawn in the field while observations are taken."},
{q:"Dumpy level telescope is:",o:["Detachable","Tilting","Rotating vertically","Rigidly fixed"],c:3,e:"Cannot tilt like a tilting level; fixed to vertical spindle."},
{q:"FB of AB=60°. BB of AB=:",o:["60°","120°","300°","240°"],c:3,e:"BB = FB+180° = 60+180 = 240°."},
{q:"Triangulation survey covers:",o:["Small plots","Road surveys only","Building surveys only","Large areas and geodetic surveys"],c:3,e:"Network of triangles with precisely measured angles and baseline."},
{q:"Clinometer measures:",o:["Horizontal angles","Distances","Bearings","Vertical angles/slopes"],c:3,e:"Clinometer (Abney level): measures slopes and vertical angles."},
{q:"Standard metric chain lengths in India:",o:["10m or 20m","50m or 100m","5m or 10m","20m or 30m"],c:3,e:"20m (100 links) or 30m (150 links)."},
{q:"Scale 1:50000 — 3cm on map represents:",o:["150 m","15 km","1.5 km","1500 m"],c:3,e:"3cm × 50000 = 150000 cm = 1500 m = 1.5 km."},
{q:"GPS requires minimum satellites for 3D fix:",o:["2","3","6","4"],c:3,e:"4 satellites needed for 3D position fix (latitude, longitude, altitude)."},
{q:"Planimeter measures:",o:["Distances","Heights","Volumes","Areas on a map"],c:3,e:"Traces boundary and gives enclosed area directly."},
{q:"Magnetic north differs from true north by:",o:["Grid angle","Convergence","Bearing","Declination angle"],c:3,e:"Declination = angle between magnetic and true meridians."},
{q:"At a change point in levelling:",o:["Only BS taken","Only FS taken","Level is set up","Both FS and next BS taken"],c:3,e:"FS closes previous setup; BS starts new instrument position."},
{q:"Closed traverse with 5 sides: sum of interior angles =:",o:["360°","720°","900°","540°"],c:3,e:"Sum = (2n−4)×90° = (10−4)×90° = 540°."},
{q:"Total station directly measures:",o:["Only distance","Coordinates only","Elevation only","Slope distance and angles"],c:3,e:"Electronic theodolite + EDM → slope distance + H/V angles."},
{q:"Hydrographic survey deals with:",o:["Mountain surveys","Aerial surveys","City surveys","Underwater surveys"],c:3,e:"Maps underwater features—depths, tides, currents."},
{q:"Number of satellites in GPS constellation:",o:["12","24","48","31–32"],c:3,e:"31–32 operational in 6 orbital planes."},
{q:"EDM measures distance using:",o:["Angle subtended","Staff intercept","Chain length","Phase difference of reflected wave"],c:3,e:"Modulated wave sent; phase difference gives distance."},
{q:"LIDAR uses:",o:["Radio waves","Sound waves","X-rays","Laser pulses"],c:3,e:"Sends laser pulses, measures return time → 3D point clouds."}
],
medium:[
{q:"Curvature correction =:",o:["0.0112 D²","0.0673 D²","0.0067 D²","0.0785 D² m"],c:3,e:"Curvature=0.0785D² (D in km), subtractive. Refraction=0.0112D²."},
{q:"Reciprocal levelling eliminates:",o:["Chaining errors","Bearing errors","Staff mistakes","Collimation + curvature + refraction errors"],c:3,e:"Reading from both sides cancels systematic errors."},
{q:"Simpson's rule needs odd number of:",o:["Stations","Lines","Angles","Ordinates"],c:3,e:"Odd ordinates (even intervals), approximates each pair as parabola."},
{q:"Closed traverse: sum of interior angles =:",o:["(2n+4)×90°","n×180°","360°","(2n−4)×90°"],c:3,e:"Polygon interior angles = (2n−4)×90°, n = sides."},
{q:"Tacheometry measures distance using:",o:["Chain","Tape","Compass","Stadia readings"],c:3,e:"D = Ks+C (level ground). K=100 typically."},
{q:"Local attraction affects:",o:["Chain","Level","Theodolite circle","Compass needle"],c:3,e:"Magnetic materials near compass deflect the needle."},
{q:"'Working whole to part' ensures:",o:["Speed","Fewer instruments","Only detail accuracy","Errors are localised"],c:3,e:"Overall framework first → details within → no error accumulation."},
{q:"Bowditch rule distributes error proportional to:",o:["Angles only","Number of stations","Bearing","Lengths of traverse legs"],c:3,e:"Bowditch (compass) rule: error ∝ line length."},

{q:"Stadia tacheometry inclined sight: horiz. distance =:",o:["Ks+C","Ks sinθ","Ks/cosθ","Ks cos²θ + C cosθ"],c:3,e:"D = Ks cos²θ + C cosθ. Elevation diff = ½Ks sin2θ + C sinθ."},

{q:"In compass survey, included angle =:",o:["FB of next−FB of prev","Sum of all bearings","Only by theodolite","BB of previous − FB of next"],c:3,e:"Included angle = BB(prev line) − FB(next line). If negative, add 360°."},

{q:"Method of repetition in theodolite work:",o:["Measures distances","Sets out curves","Levels the instrument","Increases angular precision"],c:3,e:"Angle measured multiple times, accumulated, divided by repetitions."},
{q:"Setting out circular curve: tangent length T =:",o:["R sin(Δ/2)","R cos(Δ/2)","R × Δ","R tan(Δ/2)"],c:3,e:"T = R tan(Δ/2). R=radius, Δ=deflection angle."},
{q:"Transition curve most commonly used:",o:["Cubic parabola","Lemniscate","Bernoulli spiral","Spiral (clothoid)"],c:3,e:"Spiral (LS=Rθ) is standard; cubic parabola is an approximation."},
{q:"Permissible angular closure for 1st-order traverse:",o:["30″√n","1′√n","5′√n","15″√n"],c:3,e:"1st order: 15″√n; 2nd: 30″√n; 3rd: 1′√n."},
{q:"Aerial photo scale =:",o:["H/f","f×H","1/(f×H)","f/H"],c:3,e:"Scale = focal length / flying height = f/(H−h). Flat ground: f/H."},
{q:"Map projection preserving shape is:",o:["Equal area","Azimuthal","Gnomonic","Conformal (orthomorphic)"],c:3,e:"Conformal preserves local shapes (e.g., Mercator)."},
{q:"Collimation error is proportional to:",o:["Square of distance","Cube root","Independent","Sight distance"],c:3,e:"Error ∝ sight distance. Equalising BS and FS eliminates it."},
{q:"Differential levelling closing error =:",o:["ΣFS−ΣBS","ΣBS+ΣFS","Last RL−first RL","(ΣBS−ΣFS)−(known ΔRL)"],c:3,e:"Closing error = (ΣBS−ΣFS) − (RL final BM − RL starting BM)."},
{q:"HI method is preferred when there are:",o:["Few change points","Only two points","No BM available","Many intermediate sights"],c:3,e:"HI method: compute HI once, then RL=HI−IS for each. Faster for many IS."},
{q:"Chain too long → measured distance is:",o:["Too long → subtract","No correction","Both possible","Too short → add correction"],c:3,e:"Long chain: fewer chain lengths laid → measured < true → add correction."},
{q:"GPS satellites orbit at altitude ≈:",o:["200 km","35786 km","500 km","20200 km"],c:3,e:"Medium earth orbit ~20200 km. 6 orbital planes."},
{q:"Accuracy of a 20″ theodolite traverse ≈:",o:["1 in 1000","1 in 3000","1 in 10000","1 in 5000"],c:3,e:"20″ theodolite → ~1:5000 linear accuracy in well-executed traverse."},
{q:"Traverse expected closing error ∝:",o:["n","n²","1/n","√n"],c:3,e:"Random errors: resultant ∝ √n (law of propagation of errors)."},
{q:"When declination is 0°, magnetic north coincides with:",o:["Grid north","Assumed north","South","True north"],c:3,e:"Zero declination = magnetic and true meridians coincide."},
{q:"Rise-and-fall method provides:",o:["Only RL","Only HI","Only differences","Built-in arithmetic check"],c:3,e:"Σrise−Σfall = last RL−first RL = ΣBS−ΣFS. Double check."},
{q:"Geodetic surveying accounts for:",o:["Only distances","Magnetic variation","Local attraction","Earth's curvature"],c:3,e:"For large areas (>250 km²), spheroidal shape matters."},
{q:"Well-conditioned triangles have angles between:",o:["0°–15°","60°–90° only","Any angles","30°–120°"],c:3,e:"Angles 30–120° give well-conditioned triangles. Ill-conditioned amplify errors."}

easy:[
{q:"Standard BOD test is at:",o:["20°C for 5 days","25°C for 3 days","37°C for 5 days","20°C for 3 days"],c:0,e:"BOD₅ at 20°C: ~68% of ultimate BOD. Incubated in darkness to prevent algal oxygen production."},
{q:"Acceptable turbidity in drinking water (IS 10500):",o:["1 NTU","5 NTU","10 NTU","25 NTU"],c:0,e:"IS 10500: acceptable 1 NTU, permissible (no alternative) 5 NTU."},
{q:"Chlorination is done for:",o:["Removing hardness","Disinfection","Removing colour","Reducing turbidity"],c:1,e:"Chlorine kills pathogens. Break-point chlorination ensures free residual chlorine in distribution."},
{q:"Self-purification of stream is due to:",o:["Dilution and re-aeration","Sedimentation only","Chemical reaction only","Filtration"],c:0,e:"Dilution, re-aeration, oxidation by bacteria, sedimentation, and sunlight contribute to self-purification."},
{q:"Per capita water demand in Indian cities ≈",o:["70 lpcd","135 lpcd","200 lpcd","350 lpcd"],c:1,e:"CPHEEO: ~135 lpcd domestic. Total with losses and industrial: 200+ lpcd."},
{q:"Hardness in water is caused by:",o:["Suspended solids","Ca²⁺ and Mg²⁺ ions","Iron","Chlorides"],c:1,e:"Temporary hardness: Ca/Mg bicarbonates (removed by boiling). Permanent: Ca/Mg sulphates/chlorides (removed by chemical treatment)."},
{q:"pH of potable water should be:",o:["3–5","6.5–8.5","9–11","12–14"],c:1,e:"IS 10500: acceptable pH 6.5–8.5. Acidic water corrodes pipes; alkaline water tastes bitter and forms scale."},
{q:"Sedimentation removes particles by:",o:["Chemical reaction","Gravity settling","Filtration","Evaporation"],c:1,e:"Particles heavier than water settle under gravity. Stokes' law governs settling velocity for discrete particles."},
{q:"Coagulant commonly used in water treatment:",o:["Lime only","Alum (Al₂(SO₄)₃)","Bleaching powder","Chlorine"],c:1,e:"Alum destabilises colloidal particles, forming flocs that settle. Dose: 5–40 mg/L. PACl is also widely used."},
{q:"Rapid sand filter rate is approximately:",o:["100–200 L/m²/hr","3000–6000 L/m²/hr","50 L/m²/hr","10000 L/m²/hr"],c:1,e:"Rapid sand filter: 3000–6000 L/m²/hr. Slow sand filter: 100–200 L/m²/hr (biological treatment)."},
{q:"A septic tank provides:",o:["Complete treatment","Primary (anaerobic) treatment","Tertiary treatment","Disinfection only"],c:1,e:"Septic tank: anaerobic digestion of solids + sedimentation. Effluent needs further treatment (soak pit/filter bed)."},
{q:"MPN test determines:",o:["Turbidity","Coliform bacteria count","BOD","Hardness"],c:1,e:"Most Probable Number: statistical estimate of coliform density. Indicates faecal contamination of water."},
{q:"Fire demand in a city is calculated by:",o:["Kuichling's formula: Q = 3182√P","Only by population","Only by area","Only by building height"],c:0,e:"Kuichling: Q = 3182√P (L/min), P in thousands. National Board formula also used. Fire demand affects peak demand."},
{q:"The minimum residual chlorine in distribution system should be:",o:["0.2 mg/L","1.0 mg/L","5.0 mg/L","0.01 mg/L"],c:0,e:"Free residual chlorine of 0.2 mg/L at the consumer end ensures safety against recontamination."},
{q:"Sewage is 99.9% water and 0.1%:",o:["Minerals","Solids (organic + inorganic)","Chemicals","Gases"],c:1,e:"The 0.1% includes organic solids (65%) and inorganic solids (35%). Treatment targets this small fraction."},
{q:"Manhole spacing in sewers is typically:",o:["15 m","30–45 m for small sewers, 90–300 m for large","500 m","1000 m"],c:1,e:"Manholes at changes in direction, gradient, diameter, and at regular intervals (30 m for <300mm; up to 300 m for large sewers)."},
{q:"Grit chamber removes:",o:["Organic matter","Inorganic grit and sand","Dissolved solids","Colloidal particles"],c:1,e:"Grit chambers remove heavy inorganic particles (sand, gravel, cinders) to protect downstream equipment."},
{q:"Aerobic treatment requires:",o:["No oxygen","Dissolved oxygen","Only chemicals","UV light"],c:1,e:"Aerobic bacteria need DO to decompose organic matter: C₅H₇NO₂ + O₂ → CO₂ + H₂O + NH₃ + energy."},
{q:"Fluoride content in drinking water should be less than:",o:["0.5 mg/L","1.0–1.5 mg/L","5 mg/L","10 mg/L"],c:1,e:"IS 10500: acceptable 1.0 mg/L, permissible 1.5 mg/L. Excess causes fluorosis (dental/skeletal)."},
{q:"COD test uses which oxidant?",o:["Bacteria","Potassium dichromate (K₂Cr₂O₇)","Chlorine","Ozone"],c:1,e:"COD uses a strong chemical oxidant (K₂Cr₂O₇) in acidic medium. COD > BOD as it oxidises both biodegradable and non-biodegradable matter."}

{q:"Combined sewer carries:",o:["Only sewage","Both sewage and stormwater","Only stormwater","Only industrial waste"],c:1,e:"Combined system: one sewer for both. Separate system: separate sewers for sewage and stormwater. Separate is preferred."},

{q:"Streeter-Phelps equation models:",o:["Flow in pipes","Dissolved oxygen sag curve in a stream","Sludge volume","Coagulant dose"],c:1,e:"D = (kd L₀/(kr−kd))(e^(−kd t) − e^(−kr t)) + D₀ e^(−kr t). D = DO deficit, kd = deoxygenation, kr = reaeration."},
{q:"Hydraulic loading rate for a rapid sand filter:",o:["100–200 L/m²/hr","3000–6000 L/m²/hr","10000 L/m²/hr","500 L/m²/hr"],c:1,e:"RSF: 3000–6000 L/m²/hr (120–150 m³/m²/day). SSF: 100–200 L/m²/hr. RSF needs coagulation pretreatment."},
{q:"MLSS in conventional activated sludge process is maintained at:",o:["500–1000 mg/L","1500–3000 mg/L","5000–10000 mg/L","100 mg/L"],c:1,e:"MLSS 1500–3000 mg/L in conventional ASP. Extended aeration: 3000–6000 mg/L."},
{q:"Thickening of sludge aims to:",o:["Disinfect sludge","Increase solid content by removing water","Dry sludge completely","Digest organics"],c:1,e:"Thickening reduces sludge volume by gravity or flotation, increasing solids from ~1% to 3–6% before digestion."},
{q:"MBR (Membrane Bioreactor) combines:",o:["Sedimentation + filtration","Biological treatment + membrane filtration","Chemical treatment + UV","Anaerobic + aerobic"],c:1,e:"MBR: activated sludge process + membrane (micro/ultrafiltration) replaces secondary clarifier. Produces high-quality effluent."},
{q:"RO (Reverse Osmosis) is used for:",o:["Removing turbidity","Desalination and TDS removal","Disinfection only","Removing colour only"],c:1,e:"RO forces water through semi-permeable membrane under pressure > osmotic pressure, removing dissolved salts, ions, and organics."},
{q:"Oxygen transfer efficiency in fine bubble diffused aeration is approximately:",o:["5–10%","15–30%","50–60%","90%"],c:1,e:"Fine bubble diffusers: 15–30% OTE. Coarse bubble: 6–12%. Mechanical surface aerators: 10–20%."},
{q:"The critical point on the DO sag curve occurs when:",o:["Deoxygenation rate = reaeration rate","DO is maximum","BOD is zero","Time is zero"],c:0,e:"At critical point: rate of oxygen consumption = rate of reaeration. DO deficit is maximum. tc = (1/(kr−kd)) ln[(kr/kd)(1−D₀(kr−kd)/(kdL₀))]."},
{q:"SBR (Sequencing Batch Reactor) operates in:",o:["Continuous flow","Batch mode (fill, react, settle, draw, idle)","Only anaerobic mode","Only filtration"],c:1,e:"SBR: batch cycles in a single tank — fill → react (aerate) → settle → decant → idle. All steps in one reactor."},
{q:"The permissible BOD of treated sewage for discharge into inland water is:",o:["10 mg/L","30 mg/L","100 mg/L","250 mg/L"],c:1,e:"CPCB standards: BOD ≤ 30 mg/L for discharge into inland surface waters. TSS ≤ 100 mg/L."},
{q:"Jar test is used to determine:",o:["Settling velocity","Optimum coagulant dose","BOD","MPN"],c:1,e:"Jar test simulates coagulation-flocculation at different doses. The dose giving best floc formation and clarity is the optimum."},
{q:"Recirculation ratio in trickling filter is:",o:["Flow returned / inflow","Inflow / outflow","Sludge / inflow","Zero always"],c:0,e:"R = Qr/Q. Recirculation dilutes influent, increases flow over media, improves performance for high-strength waste."},
{q:"Biochemical oxidation follows:",o:["Zero-order kinetics","First-order kinetics","Second-order kinetics","Third-order"],c:1,e:"BOD exertion: dL/dt = −kL → L = L₀e^(−kt). First-order decay. BODt = L₀(1−e^(−kt))."},
{q:"Landfill leachate treatment typically requires:",o:["Only sedimentation","Biological + chemical/physical treatment","Only chlorination","Only dilution"],c:1,e:"Leachate has high BOD, COD, ammonia, heavy metals. Needs biological treatment + RO/NF or chemical precipitation."},
{q:"Noise pollution limit for residential areas at night (CPCB) is:",o:["45 dB(A)","55 dB(A)","65 dB(A)","75 dB(A)"],c:0,e:"CPCB noise standards: residential day 55 dB(A), night 45 dB(A). Industrial: day 75, night 70. Commercial: day 65, night 55."},
{q:"Hazen's formula for surface overflow rate in sedimentation:",o:["Q/A (discharge/surface area)","Q/P","V × A","A/Q"],c:0,e:"SOR = Q/A (m³/m²/day). The critical design parameter: particles with settling velocity ≥ SOR will be removed."},
{q:"The hydraulic retention time in an oxidation ditch is approximately:",o:["1–2 hours","12–24 hours","5–7 days","30 days"],c:1,e:"Oxidation ditch (extended aeration variant): HRT 12–24 hrs, SRT 20–30 days, F/M 0.05–0.1. Low sludge production."},
{q:"Chlorine demand = Applied chlorine −",o:["Residual chlorine","BOD","Turbidity","Hardness"],c:0,e:"Cl demand = dose − residual. The demand is consumed by organic matter, ammonia, and reducing substances."}
]}},
"sa":{n:"Structural Analysis",ic:"🏗️",q:{
easy:[
{q:"Simply supported beam with UDL w: max BM at mid-span =",o:["wL²/8","wL²/12","wL²/2","wL/8"],c:0,e:"Max BM at mid-span = wL²/8. Max SF at support = wL/2."},
{q:"Degree of static indeterminacy of a propped cantilever:",o:["0","1","2","3"],c:1,e:"4 reactions − 3 equilibrium equations = 1."},
{q:"Point of contraflexure is where:",o:["SF is max","BM changes sign (BM = 0)","Deflection is zero","Slope is max"],c:1,e:"Inflection point: BM passes through zero, changing from sagging to hogging or vice versa."},
{q:"Cantilever with point load P at free end: max deflection =",o:["PL³/3EI","PL³/48EI","5wL⁴/384EI","PL²/2EI"],c:0,e:"δmax = PL³/3EI at free end. θmax = PL²/2EI at free end."},
{q:"A truss is a structure of members connected at:",o:["Rigid joints","Pin joints (hinged)","Welded joints","Riveted joints"],c:1,e:"Ideal truss: pin-jointed → members carry only axial forces (tension or compression), no bending."},
{q:"Bending stress formula: σ = M/I × y, or σ =",o:["M/Z","M × Z","M/A","M/P"],c:0,e:"σ = M/Z where Z = I/y = section modulus. Max stress at extreme fibre (max y)."},
{q:"For a fixed beam with central point load P, max BM =",o:["PL/4","PL/8","PL/2","PL/12"],c:1,e:"Fixed beam central load: max BM at supports and mid-span = PL/8 (at supports: −PL/8; at centre: +PL/8)."},
{q:"Shear force diagram for a cantilever with point load at free end is:",o:["Parabolic","Constant (rectangular)","Triangular","Zero"],c:1,e:"SF is constant = P along the entire length. BM varies linearly from 0 at free end to −PL at fixed end."},
{q:"A roller support provides:",o:["Three reactions","One vertical reaction","Two reactions","No reaction"],c:1,e:"Roller: 1 reaction (⊥ to surface). Hinge: 2 reactions (H + V). Fixed: 3 reactions (H + V + M)."},
{q:"Principle of superposition applies to:",o:["Non-linear structures","Linear elastic structures","Plastic structures","Buckling problems"],c:1,e:"Superposition: response to combined loads = sum of individual load responses. Valid only for linear elastic behaviour."},
{q:"SSB with central point load P: max BM =",o:["PL/4","PL/8","PL/2","PL/6"],c:0,e:"Max BM at mid-span = PL/4. Reactions = P/2 each."},
{q:"A member in tension is called a:",o:["Strut","Tie","Beam","Column"],c:1,e:"Tie = tension member. Strut = compression member. In trusses, upper chord often compresses, lower chord often tensions."},
{q:"Hooke's law: stress ∝ strain is valid up to:",o:["Ultimate stress","Yield stress","Proportional limit","Rupture"],c:2,e:"σ = Eε only within the proportional limit. Beyond it, the material may still be elastic (up to elastic limit) but non-linear."},
{q:"Young's modulus of steel ≈",o:["100 GPa","200 GPa","300 GPa","50 GPa"],c:1,e:"E_steel ≈ 200 GPa (2 × 10⁵ MPa). E_concrete ≈ 25 GPa (for M25). Steel is ~8× stiffer."},
{q:"Moment of inertia of a rectangle (bh³/12) is about the:",o:["Vertical axis","Centroidal axis parallel to base","Any axis","Polar axis"],c:1,e:"Ixx = bh³/12 about the centroidal axis parallel to base b. Iyy = hb³/12 about the other centroidal axis."},
{q:"Simply supported beam with UDL w: deflection at mid-span =",o:["5wL⁴/(384EI)","wL⁴/(384EI)","wL³/3EI","PL³/48EI"],c:0,e:"δmax = 5wL⁴/(384EI) for UDL on SSB. For central point load: PL³/(48EI)."},
{q:"A column is a vertical member primarily under:",o:["Bending","Axial compression","Shear","Torsion"],c:1,e:"Columns carry axial compressive loads. Slender columns may fail by buckling before material yielding."},
{q:"Euler's critical buckling load: Pcr =",o:["π²EI/L²","EI/L","σ×A","π²EA/L²"],c:0,e:"Pcr = π²EI/Le² where Le = effective length. For both ends pinned: Le = L. Applies to long/slender columns."},
{q:"The shape of BMD for a cantilever with UDL is:",o:["Linear","Parabolic","Cubic","Rectangular"],c:1,e:"SF is linear (triangular); BM is parabolic (second degree) for a cantilever with UDL."},
{q:"Free body diagram is used to show:",o:["Deformed shape","All forces acting on an isolated body","Stress distribution","Temperature distribution"],c:1,e:"FBD isolates a body and shows all external forces, reactions, and moments acting on it."}
],
medium:[
{q:"Three-moment equation (Clapeyron) analyses:",o:["Trusses","Continuous beams","Arches","Columns"],c:1,e:"Relates BM at three consecutive supports of a continuous beam. Used to find unknown support moments."},
{q:"Fixed-end moment for beam with UDL w over span L:",o:["wL²/8","wL²/12","wL²/24","wL²/6"],c:1,e:"FEM = ±wL²/12 (both ends fixed). For central point load: ±PL/8."},
{q:"Muller-Breslau principle draws:",o:["BMD","Influence line diagrams","SFD","Deflection curves"],c:1,e:"ILD for any function = deflected shape when restraint for that function is removed and unit deformation applied."},
{q:"Moment distribution factor ∝",o:["Span length","Relative stiffness (k=4EI/L)","Load","Depth"],c:1,e:"DF = member stiffness / Σstiffness at joint. Unbalanced moment distributed in proportion to DFs."},
{q:"Castigliano's I: ∂U/∂P =",o:["Stress","Strain","Deflection in direction of P","Rotation"],c:2,e:"Partial derivative of strain energy U w.r.t. force P gives deflection in direction of P."},
{q:"Carry-over factor for prismatic member (far end fixed) =",o:["0","0.5","1.0","0.67"],c:1,e:"COF = 0.5 (half the applied moment is carried over to far end). If far end pinned: COF = 0."},
{q:"Shape factor for rectangular section:",o:["1.0","1.14","1.5","1.7"],c:2,e:"SF = Zp/Ze. Rectangle: (bd²/4)/(bd²/6) = 1.5. I-section ≈ 1.14."},
{q:"Unit load method for deflection uses:",o:["Real loads only","Virtual unit load","Temperature loads","Wind loads"],c:1,e:"Apply virtual unit load at the point where deflection is needed. δ = ∫(Mm/EI)dx where m = virtual BM, M = real BM."},
{q:"Degree of kinematic indeterminacy of a rigid frame =",o:["Number of unknown reactions","Number of independent joint displacements","Number of members","Number of loads"],c:1,e:"DOF = rotations + translations − constraints. For a frame: 3j − c (j = joints, c = constraints)."},
{q:"Conjugate beam method converts:",o:["Loads to reactions","M/EI diagram to loads for computing deflection/slope","SFD to BMD","Stress to strain"],c:1,e:"Load the conjugate beam with M/EI as loading. Shear in conjugate = slope in real. BM in conjugate = deflection in real."},
{q:"In portal method of approximate analysis, hinges are assumed at:",o:["Supports only","Mid-height of columns and mid-span of beams","Quarter points","All joints"],c:1,e:"Portal method: for lateral loads. Points of inflection at mid-height of columns and mid-span of beams."},
{q:"A propped cantilever is:",o:["Statically determinate","Indeterminate to 1st degree","Indeterminate to 2nd degree","Unstable"],c:1,e:"4 reactions − 3 equations = 1 degree of indeterminacy."},
{q:"Three-hinged arch: horizontal thrust for UDL on entire span H =",o:["wL²/(8h)","PL/(4h)","wL/2","wL²/(4h)"],c:0,e:"For parabolic arch with UDL: H = wL²/(8h), same as cable. BM throughout = 0."},
{q:"Virtual work principle states that for equilibrium:",o:["Real work = potential energy","Virtual work of external forces = virtual strain energy","Kinetic energy = potential energy","Work done = 0"],c:1,e:"For a system in equilibrium, the virtual work of external forces equals the virtual internal work for any virtual displacement."},
{q:"Slope-deflection equation: Mij =",o:["2EI/L(2θi+θj−3Δ/L)+FEMij","EI/L","P×L","wL²/8"],c:0,e:"Standard form: Mij = (2EI/L)(2θi+θj−3ψ) + FEMij where ψ = sway angle Δ/L."},
{q:"Influence line for reaction at a support of SSB is:",o:["Parabolic","Triangular (linear)","Rectangular","Curved"],c:1,e:"ILD for reaction at A of SSB: triangle from 1 at A to 0 at B (linearly decreasing)."},
{q:"Maxwell's reciprocal theorem states:",o:["Deflection at A due to load at B = deflection at B due to load at A","Forces are equal and opposite","Stresses equal strains","Energy is conserved"],c:0,e:"δAB = δBA (deflection at A due to unit load at B equals deflection at B due to unit load at A)."},
{q:"A cable carrying UDL takes the shape of a:",o:["Catenary","Parabola","Circular arc","Straight line"],c:1,e:"UDL along horizontal span → parabola. Self-weight (UDL along cable length) → catenary."},
{q:"Stiffness of a fixed-fixed beam =",o:["3EI/L","4EI/L","2EI/L","12EI/L³"],c:1,e:"Rotational stiffness: fixed-fixed = 4EI/L. Fixed-pinned = 3EI/L. These are moment per unit rotation at the near end."},
{q:"In moment distribution, the distribution factor at a fixed support is:",o:["0","0.5","1.0","Infinity"],c:0,e:"A fixed end has infinite stiffness relative to the member → DF = 0 (absorbs no unbalanced moment from distribution)."}
],
hard:[
{q:"Stiffness matrix of a 2D beam element (2 DOF/node) is:",o:["2×2","4×4","6×6","3×3"],c:1,e:"2 DOFs (lateral displacement + rotation) × 2 nodes = 4×4. Including axial: 6×6."},
{q:"Independent sway modes in a regular portal frame =",o:["Number of joints","Number of storeys","Number of members","Number of fixed supports"],c:1,e:"Each storey can sway independently. Single-storey single-bay: 1 sway mode."},
{q:"Three-hinged parabolic arch with UDL over full span has:",o:["BM and SF","Zero BM throughout (only axial thrust)","Only BM","Only SF"],c:1,e:"The parabolic shape is the funicular of UDL → only axial compression, no BM or SF anywhere."},
{q:"Degree of static indeterminacy of a closed ring:",o:["0","3","6","1"],c:1,e:"Cut the ring → 3 internal forces (M, N, V) released → DSI = 3."},
{q:"Flexibility matrix is the inverse of:",o:["Mass matrix","Stiffness matrix","Damping matrix","Load matrix"],c:1,e:"[F] = [K]⁻¹. Flexibility: displacement per unit load. Stiffness: load per unit displacement."},
{q:"Column analogy method is used for:",o:["Design of columns","Analysis of fixed arches and beams","Truss analysis","Cable analysis"],c:1,e:"Column analogy (developed by Hardy Cross) treats the elastic curve problem as analogous to stresses in a short column."},
{q:"In stiffness method, primary unknowns are:",o:["Forces","Displacements (joint DOFs)","Reactions","Stresses"],c:1,e:"Stiffness (displacement) method: unknown displacements. Flexibility (force) method: unknown redundant forces."},
{q:"For portal frame sway analysis by moment distribution, correction factor =",o:["Sway moment / sum of DFs","Ratio of sway moments for arbitrary and actual sway","DF × COF","1.0 always"],c:1,e:"Perform non-sway analysis → find propping force. Then sway analysis with arbitrary sway → scale to actual propping force."},
{q:"The theorem of least work (Castigliano's II for indeterminate structures) states:",o:["Strain energy is maximum","∂U/∂R = 0 for redundant force R","Deflection is minimum","Reactions are maximum"],c:1,e:"For compatibility: ∂U/∂X = 0 where X = redundant force. Strain energy is minimum for the actual values of redundants."},
{q:"Influence line for BM at any section of SSB is:",o:["Rectangular","Triangular (peak under the section)","Parabolic","Circular"],c:1,e:"ILD for BM at section C (a from A, b from B): triangle with peak = ab/L at C."},
{q:"Williot diagram is used for:",o:["BM in beams","Joint displacements in a truss","Reactions in frames","Stress analysis"],c:1,e:"Williot (and Williot-Mohr) diagram graphically finds joint displacements in trusses from member deformations."},
{q:"Plastic moment Mp = σy ×",o:["Ze (elastic section modulus)","Zp (plastic section modulus)","I/y","A"],c:1,e:"Mp = σy × Zp. For rectangle: Zp = bd²/4. Shape factor = Zp/Ze = Mp/My."},
{q:"Number of plastic hinges needed for complete collapse of a fixed beam with central load:",o:["1","2","3","4"],c:2,e:"3 hinges: one at each fixed support + one at mid-span → mechanism. Mu = PL/8 for this case; collapse load = 8Mp/L."},
{q:"In matrix stiffness method, the global stiffness matrix is:",o:["Diagonal","Symmetric and banded","Asymmetric","Triangular"],c:1,e:"[K] is symmetric, positive semi-definite, and banded (non-zero entries near diagonal) for efficiency."},
{q:"The reduced stiffness of a member with far end hinged =",o:["4EI/L","3EI/L","2EI/L","EI/L"],c:1,e:"Modified stiffness for far end pinned: 3EI/4 × (4/L) = 3EI/L. No carry-over moment."},
{q:"Collapse load factor in plastic analysis is the ratio of:",o:["Elastic load to working load","Collapse load to working load","Working load to ultimate load","Dead load to live load"],c:1,e:"Load factor λ = collapse load / working load. For steel: minimum load factor typically 1.7 for DL+LL."},
{q:"Kinematic indeterminacy = number of possible independent:",o:["Forces","Joint displacements","Reactions","Members"],c:1,e:"Kinematic DOF = 3j − r (for plane frames). j = joints, r = total reactions. Each DOF is an unknown displacement."},
{q:"In flexibility method, the structure is made determinate by removing:",o:["Members","Redundant forces/moments","Loads","Supports entirely"],c:1,e:"Remove redundants → determinate primary structure. Apply compatibility to solve for removed redundants."},
{q:"Betti's theorem is a generalisation of:",o:["Castigliano's theorem","Maxwell's reciprocal theorem","Clapeyron's theorem","Superposition"],c:1,e:"Betti: work done by system 1 forces through system 2 displacements = work done by system 2 forces through system 1 displacements."},
{q:"ILD for SF at a section of SSB has:",o:["A single triangle","Two triangles with a vertical step at the section","A parabola","A rectangle"],c:1,e:"ILD for SF at section C has a step: +b/L to the left, −a/L to the right (discontinuity at C)."}
]}},
"rc":{n:"RCC Design",ic:"🏢",q:{
easy:[
{q:"Min grade of concrete for RCC (IS 456):",o:["M10","M15","M20","M25"],c:2,e:"IS 456 cl. 6.1.1: min M20 for RCC, M30 for prestressed."},
{q:"Nominal cover for moderate exposure:",o:["15 mm","20 mm","30 mm","50 mm"],c:2,e:"IS 456 Table 16: Mild 20, Moderate 30, Severe 45, Very severe 50, Extreme 75 mm."},
{q:"Modular ratio for M20 concrete ≈",o:["7","10","13","15"],c:2,e:"m = 280/(3σcbc). M20: σcbc = 7, m = 280/21 ≈ 13."},
{q:"Development length ensures:",o:["Shear strength","Adequate bond between steel and concrete","Min deflection","Crack control"],c:1,e:"Ld = φσs/(4τbd). Bar embedded enough to develop full design stress via bond."},
{q:"In a singly reinforced beam, lever arm z = d −",o:["0.42xu","0.5xu","xu","0.25xu"],c:0,e:"Lever arm = d − 0.42xu (limit state method). 0.42xu is the distance of resultant compressive force from top."},
{q:"Minimum reinforcement in a slab per IS 456:",o:["0.12% for Fe 415/500","0.15% for Fe 250","Both A and B","0.20%"],c:2,e:"IS 456 cl. 26.5.2.1: 0.12% of Ag for HYSD bars, 0.15% for mild steel."},
{q:"Clear cover for a slab ≥",o:["15 mm or φ, whichever is greater","20 mm","25 mm","30 mm"],c:0,e:"IS 456 cl. 26.4.1: for slab, min cover = 15 mm or bar diameter, whichever is greater (for mild exposure)."},
{q:"The effective depth of a beam is measured from:",o:["Top to bottom","Compression face to centroid of tension steel","Top to bottom steel surface","Neutral axis to bottom"],c:1,e:"d = D − cover − φ/2 (for single layer). D = overall depth."},
{q:"A balanced section fails by:",o:["Steel yielding first","Concrete crushing first","Simultaneous yielding of steel and crushing of concrete","Bond failure"],c:2,e:"Balanced: steel reaches yield strain (0.87fy/Es + 0.002) and concrete reaches 0.0035 simultaneously."},
{q:"IS 456 specifies partial safety factor for concrete strength as:",o:["1.0","1.5","1.15","2.0"],c:1,e:"γc = 1.5 for concrete; γs = 1.15 for steel. Design strength = fck/1.5 or fy/1.15."},
{q:"Two-way slab is one where Ly/Lx ≤",o:["1.0","1.5","2.0","3.0"],c:2,e:"Ly/Lx ≤ 2 → two-way slab. > 2 → one-way slab (bending mainly in shorter direction)."},
{q:"Shear reinforcement in beams is provided as:",o:["Main bars","Stirrups (vertical or inclined)","Distribution bars","Chairs"],c:1,e:"Stirrups resist diagonal tension from shear. Vertical stirrups most common; bent-up bars also used."},
{q:"The characteristic strength fck means:",o:["Average strength","Strength below which not more than 5% results fall","Maximum strength","Minimum strength"],c:1,e:"fck = 28-day cube strength with 95% probability of being exceeded. 5% allowed to fall below."},
{q:"Maximum spacing of shear stirrups ≤",o:["0.75d or 300 mm","d or 600 mm","0.5d or 200 mm","0.25d or 100 mm"],c:0,e:"IS 456 cl. 26.5.1.5: max spacing = 0.75d or 300 mm whichever is less."},
{q:"Hooks at ends of stirrups should be bent through:",o:["45°","90° or 135°","180°","360°"],c:1,e:"IS 456: stirrup hooks at 135° (preferred for seismic) or 90° into the core of the member."},
{q:"A column with Le/D < 12 is classified as:",o:["Long column","Short column","Slender column","Intermediate"],c:1,e:"Short column: Le/D < 12 (or Le/b < 12). Long/slender otherwise. Short columns fail by material failure; long by buckling."},
{q:"Effective span of a cantilever =",o:["L + d/2","L + d","L only","L + 2d"],c:0,e:"IS 456 cl. 22.2: cantilever effective span = L + d/2 (L = clear overhang from face of support, d = effective depth)."},
{q:"Standard hook for main bars: bar bent through 180° with extension of:",o:["4φ","6φ","8φ","12φ"],c:0,e:"IS 456: 180° hook with 4φ extension. 90° bend: 12φ extension (for Fe 250) or 8φ (for HYSD)."},
{q:"Distribution steel in a one-way slab is placed:",o:["Parallel to span","Perpendicular to main steel","At 45°","Only at supports"],c:1,e:"Distribution steel controls shrinkage/temperature cracks and distributes concentrated loads. Perpendicular to main steel."},
{q:"The limiting neutral axis depth xu,max/d for Fe 415 =",o:["0.53","0.48","0.46","0.36"],c:1,e:"Fe 250: 0.53; Fe 415: 0.48; Fe 500: 0.46. These ensure ductile (under-reinforced) failure."}
],
medium:[
{q:"Max tension steel in a beam (IS 456):",o:["1%","2%","4%","6%"],c:2,e:"Max 4% of bD (gross area). Min ≈ 0.85bd/fy."},
{q:"Under-reinforced beam fails by:",o:["Concrete crushing","Steel yielding then concrete crushing","Shear","Bond failure"],c:1,e:"Ductile: steel yields (warning: large deflections) before concrete ultimately crushes. Preferred design."},
{q:"Doubly reinforced beam is needed when:",o:["Shear is high","Mu > Mu,lim for given section size","Only axial load","Deflection control"],c:1,e:"When the section is restricted and moment exceeds the singly-reinforced limit, compression steel is added."},
{q:"Effective span of SSB (IS 456):",o:["Clear span + d, or c/c of supports (lesser)","c/c only","Clear span only","Clear span + 2d"],c:0,e:"IS 456 cl. 22.2: min of (clear span + d) or (c/c of supports)."},
{q:"Parabolic-rectangular stress block for concrete in IS 456:",o:["Parabolic to ε=0.002, rectangular to ε=0.0035","Fully rectangular","Fully triangular","Linear"],c:0,e:"Parabolic up to 0.002 strain (stress = 0.446fck), then constant to 0.0035 at extreme fibre."},
{q:"Critical section for punching shear in flat slab: at d/2 from:",o:["Centre of column","Face of column","Edge of slab","d from face"],c:1,e:"IS 456 cl. 31.6.2: perimeter at d/2 from column face. Punching shear stress = Vu/(perimeter × d)."},
{q:"Min eccentricity for short column (IS 456):",o:["L/500+D/30 ≥ 20mm","L/300+D/20","L/500 only","25 mm always"],c:0,e:"IS 456 cl. 25.4: emin = L/500 + D/30, minimum 20 mm. Accounts for construction imperfections."},
{q:"Effective length factor for column: both ends fixed =",o:["1.0","0.65","0.80","2.0"],c:1,e:"IS 456 Table 28: Fixed-fixed 0.65; Fixed-hinged 0.80; Hinged-hinged 1.0; Cantilever 2.0."},
{q:"Deflection limit for beams (IS 456): span/effective depth ≤",o:["20 for SSB, 26 for continuous, 7 for cantilever","10, 12, 5","30, 40, 15","15, 20, 8"],c:0,e:"Basic L/d ratios: SS 20, Continuous 26, Cantilever 7. Modified by tension/compression steel and web width."},
{q:"Torsion in RCC is resisted by:",o:["Main bars only","Longitudinal bars + closed stirrups","Stirrups only","Concrete alone"],c:1,e:"IS 456 cl. 41: torsion requires both additional longitudinal steel and closed rectangular stirrups."},
{q:"An isolated footing is designed for:",o:["Overturning only","Bending, shear (one-way and punching), and bearing pressure","Axial load only","Torsion"],c:1,e:"Check: bearing pressure ≤ SBC; one-way shear at d from face; punching at d/2; BM at face of column."},
{q:"One-way shear in a footing is checked at:",o:["Face of column","d from face of column","2d from face","Centre of footing"],c:1,e:"IS 456 cl. 34.2.4: critical section for one-way shear at distance d from the face of the column."},
{q:"Spiral reinforcement in columns provides:",o:["Torsion resistance","Confinement, increasing ductility","Bending resistance","Bond improvement"],c:1,e:"Spiral confinement of core concrete increases ductility significantly. IS 456 allows 5% extra load capacity for spiral columns."},
{q:"Minimum diameter of longitudinal bar in column:",o:["8 mm","12 mm","16 mm","20 mm"],c:1,e:"IS 456 cl. 26.5.3.1: min 12 mm diameter. Min 4 bars in rectangular, 6 in circular column."},
{q:"Max steel in a column:",o:["2% of Ag","4% of Ag","6% of Ag","8% of Ag"],c:2,e:"IS 456: max 6% of Ag (at laps, effectively 4% outside lap regions)."},
{q:"Design of staircase: effective span for a waist slab staircase =",o:["Going only","Going + one landing width each side (or c/c of supports)","Total height","Only the horizontal projection"],c:1,e:"Effective span = c/c of supports or clear span + effective depth, whichever is less."},
{q:"Bond stress in limit state design τbd for M20 with Fe 415:",o:["0.8 MPa","1.2 MPa","1.4 MPa","1.92 MPa"],c:1,e:"IS 456 Table 26.2.1.1: M20: τbd = 1.2 MPa for plain bars. For deformed bars: 60% increase → 1.92 MPa."},
{q:"Curtailment of tension bars: extend at least _____ beyond the point where no longer needed:",o:["d or 12φ","d","12φ","Both d and 12φ (whichever greater)"],c:0,e:"IS 456 cl. 26.2.3.1: bars extended beyond theoretical cut-off by at least d or 12φ whichever is greater."},
{q:"In a continuous beam, hogging moment occurs at:",o:["Mid-span","Supports","Quarter points","Free end"],c:1,e:"Continuous beams have negative (hogging) moments at interior supports and positive (sagging) at mid-spans."},
{q:"IS 13920 deals with:",o:["General RCC design","Ductile detailing for seismic resistance","Prestressed concrete","Steel structures"],c:1,e:"IS 13920: ductile detailing of RCC structures in seismic zones. Requires 135° hooks, close stirrup spacing, etc."}
],
hard:[
{q:"For Fe 500 steel, xu,max/d =",o:["0.53","0.48","0.46","0.36"],c:2,e:"xu,max/d = 0.0035/(0.0035+0.87fy/Es+0.002). Fe500: 0.46. Fe415: 0.48. Fe250: 0.53."},
{q:"Moment of resistance Mu,lim for Fe415, M20 (singly reinforced):",o:["0.138 fck bd²","0.167 fck bd²","0.149 fck bd²","0.133 fck bd²"],c:2,e:"Mu,lim = 0.36×xu,max/d×(1−0.42xu,max/d)×fck×bd². For Fe415: 0.36×0.48×(1−0.42×0.48)×fck×bd² = 0.138×fck×bd². Actually for Fe415: coefficient ≈ 0.138. For Fe500: 0.133."},
{q:"Shear strength of concrete τc depends on:",o:["Grade of concrete and % tension steel","Only concrete grade","Only steel grade","Cover depth"],c:0,e:"IS 456 Table 19: τc varies with fck and percentage of tension steel (pt = 100Ast/bd). Higher pt → higher τc."},
{q:"Nominal shear stress τv = Vu/(bd). If τv > τc,max, the section must be:",o:["Redesigned (enlarged)","Provided with more stirrups","Left as is","Given more cover"],c:0,e:"IS 456: if τv > τc,max (Table 20), no amount of shear reinforcement suffices—must increase b or d."},
{q:"Span/depth ratio for flanged beam (IS 456) uses modification factor based on:",o:["Width of flange","Percentage of tension steel and fst","Concrete grade only","Shear force"],c:1,e:"Modification factor from Fig. 4 of IS 456 depends on pt and service stress fst = 0.58fy×Ast,req/Ast,prov."},
{q:"In two-way slabs (IS 456 Table 26), moment coefficients depend on:",o:["Ly/Lx and edge conditions","Only span","Only load","Only concrete grade"],c:0,e:"αx and αy coefficients depend on Ly/Lx ratio and boundary conditions (all edges fixed, one/two edges discontinuous, etc.)."},
{q:"Design of combined footing: critical section for BM is at:",o:["Centre of footing","Face of each column","Edge of footing","Quarter span"],c:1,e:"BM is maximum at the faces of the columns. The footing is designed as an inverted beam loaded by soil pressure."},
{q:"Limit state of collapse for compression members uses:",o:["Interaction (P-M) diagram","Only axial capacity","Only moment capacity","Only shear"],c:0,e:"Columns under P + M are designed using interaction diagrams (SP-16 charts) that show safe combinations of axial load and moment."},
{q:"Deep beam (IS 456): span/depth < _____ for SSB:",o:["2.0","2.5","5.0","10.0"],c:0,e:"IS 456 cl. 29: simply supported span/D < 2.0, continuous span/D < 2.5 → deep beam. Special design needed (strut-and-tie)."},
{q:"Minimum eccentricity in IS 456 ensures that the column design accounts for:",o:["Earthquake forces","Accidental eccentricity and construction imperfections","Temperature effects","Creep"],c:1,e:"emin covers imperfections in construction alignment, load placement, and member geometry."},
{q:"In flanged beams (T-beam), effective flange width bf =",o:["Lo/6 + bw + 6Df","Actual width","bw + 16Df","All of the above depending on conditions"],c:0,e:"IS 456 cl. 23.1.2: bf = Lo/6 + bw + 6Df (for T-beam) where Lo = distance between points of zero moment."},
{q:"Lap length for bars in compression =",o:["Ld","Ld or 24φ (whichever greater)","12φ","36φ"],c:1,e:"IS 456 cl. 26.2.5.1: compression lap = Ld (in compression). For tension: Ld or 30φ whichever greater."},
{q:"Punching shear stress in flat slab = Vu/(b₀d), where b₀ =",o:["Perimeter of column","Perimeter at d/2 from column face","Area of column","Depth of slab"],c:1,e:"b₀ = critical perimeter at d/2 from column face. For square column (a×a): b₀ = 4(a+d)."},
{q:"Limit state of serviceability checks for:",o:["Ultimate strength","Deflection, cracking, and vibration","Collapse only","Fire resistance only"],c:1,e:"SLS ensures comfort and durability: deflection within limits, crack widths acceptable, no excessive vibration."},
{q:"In IS 456, the stress-strain curve for steel in limit state design is:",o:["Linear","Bilinear (linear elastic + plastic plateau)","Parabolic","Hyperbolic"],c:1,e:"For HYSD bars: linear up to 0.8fy (with inelastic strain of 0.002 at fy/1.15). IS 456 Fig. 23B."},
{q:"Anchorage value of a 90° bend in steel =",o:["4φ","8φ","12φ","16φ"],c:1,e:"IS 456 cl. 26.2.2.1: 90° bend → anchorage = 8φ. 135° bend = 12φ. 180° hook = 16φ."},
{q:"SP-16 is used for:",o:["Concrete mix design","Design aids for reinforced concrete (IS 456)","Seismic design","Steel structure design"],c:1,e:"SP-16: design charts and tables for IS 456. Includes interaction diagrams for columns, moment capacity tables, etc."},
{q:"In a retaining wall, the stem is designed as a:",o:["Column","Cantilever slab","Simply supported beam","Two-way slab"],c:1,e:"The stem acts as a vertical cantilever fixed at the base, carrying lateral earth pressure."},
{q:"Shrinkage and temperature reinforcement in slabs per IS 456:",o:["Same as minimum steel requirements","Additional to main steel","Not required","Only in one direction"],c:0,e:"The minimum reinforcement (0.12% for HYSD, 0.15% for MS) serves as shrinkage/temperature steel in the secondary direction."},
{q:"For seismic design, the response reduction factor R accounts for:",o:["Only ductility","Ductility, overstrength, and redundancy","Only overstrength","Damping only"],c:1,e:"R reduces the elastic seismic force. Higher R for ductile frames (SMRF: R=5). Lower R for less ductile systems."}
]}},
"es":{n:"Estimation & Costing",ic:"📊",q:{
easy:[
{q:"Plinth area is measured at:",o:["Floor level","Plinth level (outer dimensions)","Roof level","Foundation"],c:1,e:"Built-up covered area at plinth level, measured at outer face of external walls."},
{q:"One bag of cement =",o:["40 kg","50 kg","25 kg","100 kg"],c:1,e:"1 bag = 50 kg. Volume ≈ 0.0347 m³. About 28.8 bags per m³."},
{q:"Earthwork is measured in:",o:["m²","Running m","m³","kg"],c:2,e:"Volume = L × B × D. IS 1200 specifies measurement rules for earthwork."},
{q:"Contingency provision is typically:",o:["1–2%","3–5%","10–15%","20–25%"],c:1,e:"3–5% added for unforeseen items, price variations, and minor extras."},
{q:"Long wall–short wall method: long wall =",o:["Out to out","Centre to centre","In to in","Face to face"],c:1,e:"Long wall = centre-to-centre length. Short wall = in-to-in. Avoids double counting at junctions."},
{q:"Unit of measurement for painting is:",o:["m³","m²","Running m","kg"],c:1,e:"Painting, plastering, flooring, and similar surface works are measured in square metres."},
{q:"Abstract of cost in estimation summarises:",o:["Material list","Total cost of all items","Only labour rates","Only material rates"],c:1,e:"Abstract = summary table of all estimated items with their quantities, rates, and amounts. Grand total at bottom."},
{q:"Standard height of a room for estimation purposes is:",o:["2.5 m","3.0 m","3.5 m","4.0 m"],c:1,e:"Standard room height: 3.0 m (floor to ceiling). Plinth height: 0.3–0.6 m above ground level."},
{q:"Centre-line method is best when:",o:["All walls have different thicknesses","All walls have the same cross-section","Building is multi-storeyed","Walls are curved"],c:1,e:"Centre-line method: total centre-line length × cross-section area. Efficient when all walls are identical."},
{q:"The item 'PCC 1:4:8' means:",o:["1 cement: 4 sand: 8 aggregate","1 cement: 4 aggregate: 8 sand","1 sand: 4 cement: 8 aggregate","1 aggregate: 4 cement: 8 sand"],c:0,e:"PCC/concrete proportions: cement : fine aggregate (sand) : coarse aggregate. 1:4:8 is lean concrete for bedding."},
{q:"Lead and lift in estimation refer to:",o:["Horizontal and vertical transport distance of materials","Only horizontal distance","Only vertical height","Weight of materials"],c:0,e:"Lead = horizontal distance of material transport. Lift = vertical height of lifting material. Both affect labour rates."},
{q:"Measurement book (MB) is a:",o:["Design document","Official record of measurements taken at site","Rate analysis book","Specification book"],c:1,e:"MB is the primary document recording all field measurements. It is a legal document for payment certification."},
{q:"The carpet area of a room excludes:",o:["Window area","Wall thickness","Furniture area","Floor finish"],c:1,e:"Carpet area = area within walls (usable floor area). Excludes walls, columns, and balconies."},
{q:"Plastering is measured in:",o:["m³","m²","Running m","Numbers"],c:1,e:"Plastering = surface area in m². Deductions for openings > 0.5 m² (varies by practice)."},
{q:"WBM (Water Bound Macadam) in estimation is measured by:",o:["Weight","Volume after compaction (m³)","Length","Area"],c:2,e:"WBM is measured in cubic metres of compacted work. Loose volume is greater due to voids."},
{q:"First and final bill in a contract is issued when:",o:["Work is halfway done","Work is fully completed","Before work starts","After every month"],c:1,e:"Running/interim bills during work; final bill after completion and measurement verification."},
{q:"In estimation, 'specification' describes:",o:["Quantities","Quality, proportions, and workmanship of each item","Only cost","Only materials"],c:1,e:"Specifications detail the materials, mix ratios, methods of construction, and quality standards for each work item."},
{q:"The purpose of a detailed estimate is to:",o:["Give a rough idea of cost","Determine accurate cost based on detailed drawings and specifications","Estimate only labour","Estimate only materials"],c:1,e:"Detailed estimate: item-wise quantities from drawings × rates = accurate total cost. Basis for tendering."},
{q:"A running account bill is issued:",o:["At project end","Periodically during construction for interim payment","Before work starts","Only once"],c:1,e:"Running bills (RA bills) are periodic valuations of work done, enabling interim payments to the contractor."},
{q:"The plinth area of a building includes:",o:["Open courtyards","Built-up area including walls within outer walls","Only room area","Only corridor area"],c:1,e:"Plinth area includes walls, columns, corridors, verandahs (covered), but excludes open courtyards and uncovered areas."}
],
medium:[
{q:"M20 nominal mix ratio is:",o:["1:1:2","1:1.5:3","1:2:4","1:3:6"],c:1,e:"IS 456 Table 9: M20=1:1.5:3, M15=1:2:4, M10=1:3:6."},
{q:"Dry volume of mortar ≈ ____ × wet volume:",o:["1.10","1.25","1.33","1.50"],c:2,e:"33% more dry materials needed to produce 1 m³ wet mortar (voids are filled during mixing)."},
{q:"Rate analysis includes:",o:["Material only","Labour + material + overhead + profit","Labour only","Machinery only"],c:1,e:"Rate = material cost (with wastage) + labour + T&P + water + overhead + contractor's profit."},
{q:"Sinking fund method calculates:",o:["Estimated cost","Depreciation (annual installment for replacement)","Market value","Rental income"],c:1,e:"Annual sinking fund = (cost − scrap) × i/[(1+i)ⁿ − 1]. Accumulates to replacement cost at end of life."},
{q:"Standard deductions for openings in wall estimation:",o:["Only for openings > 1 m²","All openings deducted","Only doors","Only windows > 2 m²"],c:1,e:"Per IS 1200, all openings (doors, windows) are deducted. Lintels, sills, jambs added separately."},
{q:"Capitalised value =",o:["Annual rent × Years purchase","Annual rent / Rate of return","Construction cost + land","Scrap + depreciation"],c:0,e:"CV = net annual income × (100/r) = net income × years purchase. At 5%: YP = 20."},
{q:"Work-charged establishment cost ≈",o:["1–1.5% of estimate","5–7%","10–15%","20%"],c:0,e:"Salaries of staff directly on the work (overseers, watchmen). Centage charges (admin) are additional 2–5%."},
{q:"Annual repair cost for a well-maintained building ≈",o:["0.5–1.5% of cost","5–7%","10%","15%"],c:0,e:"0.5–1.5% for well-maintained; up to 2–5% for old/poorly maintained buildings."},
{q:"In earthwork, prismoidal formula gives more accurate results than:",o:["Simpson's rule","End area method when ground is irregular","Centre-line method","Trapezoidal rule"],c:1,e:"Prismoidal: V = L/6(A₁+4Am+A₂). Better than average end area V=(A₁+A₂)L/2 for irregular ground."},
{q:"Depreciation by straight-line method: annual depreciation =",o:["(Cost − Scrap) / Life","Cost / Life","Scrap / Life","(Cost + Scrap) / Life"],c:0,e:"Simplest method: equal amount each year = (Original cost − Salvage value) / Useful life in years."},
{q:"For brick masonry, the quantity of cement per m³ in CM 1:6 ≈",o:["0.105 m³ (3 bags)","0.20 m³ (6 bags)","0.50 m³ (15 bags)","1 m³"],c:0,e:"Mortar quantity ≈ 30% of masonry volume. In 1:6 ratio, cement = (1/7)×0.30×1.33 ≈ 0.057 m³ per m³. With wastage ≈ 3 bags."},
{q:"Rent fixation uses which method?",o:["Only market comparison","Percentage of cost of construction","Sinking fund only","Depreciation only"],c:1,e:"Rent = % return on capital (6–10%) + taxes + insurance + repairs + depreciation. Typically 8–12% of total cost."},
{q:"IS 1200 deals with:",o:["Concrete design","Method of measurement of building works","Steel structures","Soil testing"],c:1,e:"IS 1200 (various parts) specifies standard methods of measurement for different construction items."},
{q:"Revised estimate is prepared when:",o:["Cost exceeds 5% of original estimate","Cost exceeds sanctioned amount by more than 5–10%","Any change occurs","Every year"],c:1,e:"When actual cost is likely to exceed the sanctioned estimate by > 5% (or 10% in some departments), a revised estimate is needed."},
{q:"Supplementary estimate is for:",o:["Original work","Additional/new items not in the original scope","Reduced scope","Defect repairs"],c:1,e:"Supplementary estimate covers new items of work arising during construction that were not part of the original estimate."},
{q:"PWD (Public Works Department) rates are published as:",o:["District Schedule of Rates (DSR)","Only material rates","Market rates","Contract rates"],c:0,e:"DSR is the standard schedule of rates published by PWD for each district, used for government works."},
{q:"In valuation, salvage value is the:",o:["Original cost","Value at the end of useful life","Insurance value","Market value"],c:1,e:"Salvage (scrap) value: residual value of the structure at the end of its useful life, typically 10% of original cost."},
{q:"For RCC work, the quantity of steel per m³ is approximately:",o:["40–60 kg (slabs)","78.5 kg","200 kg","10 kg"],c:0,e:"Thumb rules: slabs 40–60 kg/m³, beams 100–150 kg/m³, columns 150–250 kg/m³, footings 50–80 kg/m³."},
{q:"Preliminary estimate is prepared from:",o:["Detailed drawings","Plinth area or unit rates of similar projects","Actual field measurements","Tenders received"],c:1,e:"Preliminary/approximate estimate uses plinth area rates or cost per unit of accommodation from similar past projects."},
{q:"The cost index is used to:",o:["Measure quality","Update old estimates to current price levels","Calculate labour hours","Find material quantities"],c:1,e:"Cost index = (current cost / base year cost) × 100. Multiplied by old estimate to get updated cost."}
],
hard:[
{q:"In earthwork, the mean area method: V =",o:["(A₁+A₂)/2 × L","L/6(A₁+4Am+A₂)","A₁×L","(A₁−A₂)×L"],c:0,e:"Average end area method: V = (A₁+A₂)/2 × L. Overestimates when sections vary. Prismoidal is more accurate."},
{q:"Under-bridge clearance for national highway (NH) with river:",o:["1.5 m above HFL","Minimum 1.2 m above HFL","0.5 m above HFL","3 m above HFL"],c:0,e:"Minimum vertical clearance above HFL: 1.5 m for NH. This accounts for floating debris and wave action."},
{q:"Profit and overhead in rate analysis is typically:",o:["5% + 10%","10% profit + 5% overhead","15% combined","25% combined"],c:2,e:"Contractor's overhead ≈ 5% and profit ≈ 10%, combined ~15% of prime cost (materials + labour)."},
{q:"Standard output of a mason per day for brick masonry in CM 1:6 ≈",o:["1.0–1.5 m³","0.4–0.5 m³","5 m³","10 m³"],c:0,e:"One mason + 1 labourer ≈ 1.0–1.5 m³/day for brick masonry. Output varies with complexity and skill."},
{q:"Life of an RCC building for depreciation purposes ≈",o:["20 years","50–60 years","100 years","200 years"],c:1,e:"RCC buildings: 50–80 years. Load-bearing masonry: 40–60 years. Timber: 20–40 years."},
{q:"In valuation, the net annual income =",o:["Gross rent − outgoings","Gross rent only","Gross rent + repairs","Gross rent × years"],c:0,e:"Outgoings include: taxes, insurance, repairs, collection charges, vacancy allowance (≈ 10% of gross rent)."},
{q:"Escalation clause in a contract provides for:",o:["Fixed price always","Adjustment for price rise in materials/labour","Penalty for delay","Bonus for early completion"],c:1,e:"Escalation clause adjusts contract value based on published indices for materials (steel, cement, bitumen) and labour."},
{q:"The total volume of materials (cement + sand) for 1 m³ of CM 1:6 wet mortar ≈",o:["1.00 m³","1.33 m³ dry volume","0.50 m³","2.00 m³"],c:1,e:"Wet 1 m³ needs ~1.33 m³ dry (33% bulkage). Cement = 1.33/7 = 0.19 m³ ≈ 5.5 bags. Sand = 1.33×6/7 ≈ 1.14 m³."},
{q:"In BOQ (Bill of Quantities), items are arranged by:",o:["Random order","Trade or work sequence","Alphabetical","Reverse order"],c:1,e:"BOQ follows construction sequence: earthwork → foundation → masonry → concrete → finishing → services."},
{q:"Number of bricks per m³ of brick masonry (standard size, CM 1:6) ≈",o:["100","300","500","1000"],c:2,e:"Approx 500 bricks per m³ for standard modular bricks (200×100×100 mm with mortar). Non-modular: ~450."},
{q:"Valuation of a property by the investment method uses:",o:["Construction cost only","Net income capitalised at market yield","Only land value","Depreciated replacement cost"],c:1,e:"Investment method: Value = Net annual income / Rate of return. For income-producing properties."},
{q:"Schedule of rates is revised typically every:",o:["Month","1–2 years","5–10 years","25 years"],c:1,e:"DSR is revised by PWD every 1–2 years to reflect current market prices of materials and labour."},
{q:"In a tender, the earnest money deposit (EMD) is typically:",o:["1–2% of estimated cost","5–10%","25%","50%"],c:0,e:"EMD ≈ 1–2% of estimated cost. Security deposit ≈ 5–10%. Performance guarantee ≈ 5%."},
{q:"Cost per m² of RCC construction in Uttarakhand (2024 approx) is roughly:",o:["₹500–1000","₹1500–2500","₹5000–8000","₹20000–30000"],c:1,e:"Approximate: ₹1500–2500/m² for RCC structure only (varies with location, specification, and market)."},
{q:"Measurement of reinforcement in estimation is in:",o:["m³","kg (by weight)","m²","Numbers"],c:1,e:"Reinforcement steel is measured by weight (kg). Diameter and length are measured, weight = (φ²/162) × length (in kg, φ in mm, L in m)."},
{q:"In tender evaluation, the L1 bidder is:",o:["Highest bidder","Lowest responsive bidder","Average bidder","Last bidder"],c:1,e:"L1 = lowest valid technical and financial bid. In government works, L1 is generally awarded the contract."},
{q:"Defect liability period (DLP) in construction contracts is typically:",o:["1 month","6–12 months","5 years","10 years"],c:1,e:"DLP ≈ 6–12 months after completion. Contractor rectifies defects at own cost during this period."},
{q:"The cost of formwork is typically what % of RCC cost?",o:["5–10%","20–30%","50–60%","70–80%"],c:1,e:"Formwork can be 20–30% of RCC cost. It includes materials, labour, and stripping. Reuse reduces cost."},
{q:"For government works, technical sanction means:",o:["Financial approval","Approval of design and estimate by competent technical authority","Administrative approval","Audit clearance"],c:1,e:"Technical sanction: competent authority approves the design, specifications, and estimated cost."},
{q:"Tender premium/rebate is applied on the:",o:["Estimated cost","Schedule of rates","BOQ total (quoted rates)","Material cost only"],c:2,e:"Contractor quotes a percentage above (premium) or below (rebate) the estimated rates in the BOQ."}
]}},
"ct":{n:"Concrete Technology",ic:"🧪",q:{
easy:[
{q:"Workability of concrete is measured by:",o:["Compression test","Slump test","Tensile test","Permeability test"],c:1,e:"Slump test (IS 1199): most common field test. Others: compacting factor, Vee-Bee, flow test."},
{q:"Water-cement ratio most affects:",o:["Colour","Strength and durability","Weight","Curing time"],c:1,e:"Abrams' law: strength inversely related to w/c. IS 456 specifies max w/c for different exposures."},
{q:"Initial setting time of OPC ≥",o:["15 min","30 min","60 min","120 min"],c:1,e:"IS 269: initial ≥ 30 min, final ≤ 600 min. Allows time for mixing, transport, and placement."},
{q:"Segregation means:",o:["Uniform mixing","Separation of constituents","Bleeding","Workability loss"],c:1,e:"Coarse aggregate separates from mortar due to excessive vibration, free fall, or poor grading."},
{q:"Standard cube size for testing (India):",o:["100 mm","150 mm","200 mm","300 mm"],c:1,e:"IS 516: 150 mm cubes. Cylinder (150×300 mm) strength ≈ 0.8 × cube strength."},
{q:"Curing of concrete means:",o:["Heating concrete","Maintaining moisture and temperature for hydration","Adding chemicals","Removing formwork"],c:1,e:"Curing keeps concrete moist for cement hydration. Methods: water ponding, wet hessian, curing compound."},
{q:"Bleeding in concrete is:",o:["Rise of water to the surface","Segregation of aggregate","Loss of cement","Cracking"],c:0,e:"Bleeding: water rises to surface as solids settle. Excessive bleeding creates weak surface layer."},
{q:"A concrete mix 1:1.5:3 refers to:",o:["Cement:Sand:Aggregate by volume","Sand:Cement:Aggregate","Aggregate:Sand:Cement","Cement:Aggregate:Sand"],c:0,e:"Standard notation: cement : fine aggregate (sand) : coarse aggregate by volume."},
{q:"The purpose of vibration in concreting is:",o:["To cool concrete","To compact and remove air voids","To add water","To increase setting time"],c:1,e:"Vibration expels trapped air, compacts concrete, and ensures it fills all spaces in the formwork."},
{q:"Grade M25 means characteristic strength of:",o:["25 MPa at 7 days","25 MPa at 28 days","25 MPa at 3 days","25 kg/cm²"],c:1,e:"M = Mix, 25 = 28-day characteristic cube compressive strength in MPa (N/mm²)."},
{q:"Ready-mix concrete (RMC) is batched at a:",o:["Site","Central mixing plant","Lab","Quarry"],c:1,e:"RMC is mixed in a central plant and transported in transit mixers. Better quality control."},
{q:"Fineness modulus of sand for concrete should be:",o:["1.0–2.0","2.2–3.2","4.0–5.0","6.0–7.0"],c:1,e:"FM 2.2–3.2 for fine aggregate. <2.2 too fine, >3.2 too coarse. FM = ΣCumulative % retained/100."},
{q:"Slump of concrete for beams and slabs is typically:",o:["0–25 mm","50–100 mm","150–200 mm","250+ mm"],c:1,e:"Beams/slabs: 50–100 mm. Mass concrete: 25–50 mm. Columns: 75–150 mm. Tremie: 150–200 mm."},
{q:"The test to check the quality of concrete in an existing structure:",o:["Slump test","Rebound hammer test","Cube test","Flow test"],c:1,e:"Rebound hammer (NDT) estimates in-situ compressive strength from surface hardness."},
{q:"Air entrainment improves:",o:["Strength significantly","Freeze-thaw resistance and workability","Density","Setting time"],c:1,e:"Tiny air bubbles (3–6 %) improve workability and frost resistance but reduce strength slightly (~5 % per 1 % air)."},
{q:"The water used for mixing concrete should be:",o:["Any water","Potable (drinking) water quality","Sea water","Industrial waste water"],c:1,e:"IS 456 cl. 5.4: water should be clean, free from oils, acids, alkalis, organic matter. Potable water is generally acceptable."},
{q:"Concrete gains about __% of 28-day strength at 7 days:",o:["25%","50%","65%","90%"],c:2,e:"7-day strength ≈ 65% of 28-day strength for OPC. 3-day ≈ 40%. 14-day ≈ 90%."},
{q:"Honeycombing in concrete is caused by:",o:["Excess water","Inadequate compaction or insufficient fines","Over-vibration","Too much cement"],c:1,e:"Honeycombing: voids due to poor compaction, too little mortar, or formwork leakage. Weakens the member."},

/* ══════ RANDOMIZE OPTIONS AT RUNTIME ══════ */
// Shuffle options for each question so correct answer position varies
(function randomizeOptions(){
  for(const subj of Object.values(QB)){
    const qs = subj.q || subj.questions;
    if(!qs) continue;
    for(const diff of ['easy','medium','hard']){
      if(!qs[diff]) continue;
      qs[diff].forEach(q => {
        const opts = q.o || q.options;
        const correct = q.c || q.correct;
        if(!opts || correct === undefined) return;
        const correctText = opts[correct];
        // Fisher-Yates shuffle
        for(let i=opts.length-1;i>0;i--){
          const j=Math.floor(Math.random()*(i+1));
          [opts[i],opts[j]]=[opts[j],opts[i]];
        }
        // Update correct index
        const key = q.o ? 'c' : 'correct';
        q[key] = opts.indexOf(correctText);
      });
    }
  }
})();

/* ══════ NORMALIZE QB KEYS ══════ */
for(const[k,v] of Object.entries(QB)){
  if(v.name && !v.n) v.n=v.name;
  if(v.icon && !v.ic) v.ic=v.icon;
  if(v.questions && !v.q) v.q=v.questions;
  if(v.q){
    ['easy','medium','hard'].forEach(d=>{
      if(v.q[d]) v.q[d].forEach(q=>{
        if(q.options && !q.o) q.o=q.options;
        if(q.correct!==undefined && q.c===undefined) q.c=q.correct;
        if(q.exp && !q.e) q.e=q.exp;
      });
    });
  }
}

  renderGrid();setupPills();
  $("start-btn").onclick=startQuiz;
  $("skip-b").onclick=skipQ;
  $("next-b").onclick=nextQ;
  $("fin-b").onclick=showResults;
  let total=0;
  Object.values(QB).forEach(s=>{
    const qs=s.q;
    ['easy','medium','hard'].forEach(d=>{if(qs[d])total+=qs[d].length});
  });
  $("total-count").textContent=total+" questions across 12 subjects — fully offline";
}
function renderGrid(){
  const g=$("subject-grid");g.innerHTML="";
  for(const[k,s]of Object.entries(QB)){
    const qs=s.q;
    let t=0;['easy','medium','hard'].forEach(d=>{if(qs[d])t+=qs[d].length});
    const c=document.createElement("div");c.className="sc";c.dataset.k=k;
    c.innerHTML=`<span class="ic">${s.ic}</span><div class="nm">${s.n}</div><div class="ct">${t} Qs</div><div class="ck">✓</div>`;
    c.onclick=()=>togSub(c,k);g.appendChild(c);
  }
}
function togSub(c,k){c.classList.toggle("sel");S.sel=S.sel.includes(k)?S.sel.filter(x=>x!==k):[...S.sel,k];updBtn();}
function updBtn(){
  const pool=getPool();const n=S.cnt==="all"?pool.length:Math.min(S.cnt,pool.length);
  $("start-btn").disabled=!S.sel.length;
  $("si").textContent=S.sel.length?`${n} question${n>1?"s":""} from ${S.sel.length} subject${S.sel.length>1?"s":""}`:"Select at least one subject";
}
function setupPills(){
  document.querySelectorAll(".pg").forEach(g=>{g.querySelectorAll(".pi").forEach(p=>{
    p.onclick=()=>{g.querySelectorAll(".pi").forEach(x=>x.classList.remove("a"));p.classList.add("a");
      const v=p.dataset.v;
      if(g.id==="dp")S.diff=v;else if(g.id==="cp")S.cnt=v==="all"?"all":+v;else S.tmr=+v;
      updBtn();};
  });});
}
function getPool(){
  let p=[];
  S.sel.forEach(k=>{const s=QB[k];const qs=s.q;
    if(S.diff==="mixed")['easy','medium','hard'].forEach(d=>{if(qs[d])qs[d].forEach(q=>p.push({...q,sub:s.n,d}))});
    else if(qs[S.diff]) qs[S.diff].forEach(q=>p.push({...q,sub:s.n,d:S.diff}));
  });
  return shuffle(p);
}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

/* ══════ QUIZ ══════ */
function startQuiz(){
  let p=getPool();const n=S.cnt==="all"?p.length:Math.min(S.cnt,p.length);
  S.qs=p.slice(0,n);S.cur=0;S.ans=Array(n).fill(null);
  show("quiz-screen");renderQ();
}
function renderQ(){
  const q=S.qs[S.cur],t=S.qs.length,L=["A","B","C","D"];
  $("qs").textContent=q.sub;$("qcn").textContent=`${S.cur+1} / ${t}`;
  $("pf").style.width=`${(S.cur/t)*100}%`;
  $("qtxt").textContent=`Q${S.cur+1}. ${q.q}`;
  const od=$("qo");od.innerHTML="";
  q.o.forEach((o,i)=>{const el=document.createElement("div");el.className="op";el.dataset.i=i;
    el.innerHTML=`<span class="lt">${L[i]}</span><span class="ot">${o}</span>`;
    el.onclick=()=>selOpt(i);od.appendChild(el);});
  $("qe").classList.add("hd");$("next-b").style.display="none";$("fin-b").style.display="none";$("skip-b").style.display="";
  clearInterval(S.ti);const te=$("qtm");
  if(S.tmr>0){S.tl=S.tmr;te.textContent=fmt(S.tl);te.style.display="";
    S.ti=setInterval(()=>{S.tl--;te.textContent=fmt(S.tl);if(S.tl<=0){clearInterval(S.ti);autoSub();}},1000);
  }else te.style.display="none";
}
function fmt(s){return`${Math.floor(s/60)}:${(s%60).toString().padStart(2,"0")}`;}
function selOpt(i){
  clearInterval(S.ti);const q=S.qs[S.cur];S.ans[S.cur]=i;
  document.querySelectorAll("#qo .op").forEach(el=>{el.classList.add("dis");el.style.pointerEvents="none";
    const idx=+el.dataset.i;if(idx===q.c)el.classList.add("cor");if(idx===i&&i!==q.c)el.classList.add("wrg");});
  const ok=i===q.c;$("qe").innerHTML=`<strong>${ok?"✅ Correct!":"❌ Incorrect."}</strong> ${q.e}`;$("qe").classList.remove("hd");
  $("skip-b").style.display="none";
  (S.cur<S.qs.length-1?$("next-b"):$("fin-b")).style.display="";
}
function autoSub(){
  if(S.ans[S.cur]!==null)return;S.ans[S.cur]=-1;
  document.querySelectorAll("#qo .op").forEach(el=>{el.classList.add("dis");el.style.pointerEvents="none";
    if(+el.dataset.i===S.qs[S.cur].c)el.classList.add("cor");});
  $("qe").innerHTML=`<strong>⏱️ Time's up!</strong> ${S.qs[S.cur].e}`;$("qe").classList.remove("hd");
  $("skip-b").style.display="none";(S.cur<S.qs.length-1?$("next-b"):$("fin-b")).style.display="";
}
function skipQ(){clearInterval(S.ti);S.ans[S.cur]=-1;S.cur<S.qs.length-1?(S.cur++,renderQ()):showResults();}
function nextQ(){S.cur++;renderQ();}

/* ══════ RESULTS ══════ */
function showResults(){
  clearInterval(S.ti);show("result-screen");
  let ok=0,no=0,sk=0;S.ans.forEach((a,i)=>{if(a===null||a===-1)sk++;else if(a===S.qs[i].c)ok++;else no++;});
  const t=S.qs.length,pct=Math.round(ok/t*100);
  const circ=2*Math.PI*56,ring=$("ring");
  ring.style.stroke=pct>=70?"var(--ok)":pct>=40?"var(--wa)":"var(--no)";
  setTimeout(()=>ring.style.strokeDashoffset=circ-(circ*pct/100),100);
  $("rpc").textContent=pct+"%";$("rof").textContent=`${ok} of ${t} correct`;
  let g="";if(pct>=90)g="🏆 Outstanding!";else if(pct>=70)g="👏 Well Done!";else if(pct>=50)g="💪 Good Effort";else if(pct>=30)g="📖 Keep Practising";else g="🔄 Review Topics";
  $("rgr").textContent=g;
  $("rst").innerHTML=`<span><span class="dt g"></span> ${ok} correct</span><span><span class="dt r"></span> ${no} wrong</span><span><span class="dt y"></span> ${sk} skipped</span>`;
  const rl=$("rvl");rl.innerHTML="";const L=["A","B","C","D"];
  S.qs.forEach((q,i)=>{
    const a=S.ans[i],wc=a===q.c,ws=a===null||a===-1;
    const cls=ws?"ws":wc?"wc":"ww";
    let ah="";
    if(ws)ah=`<span class="tg skt">SKIPPED</span> Correct: ${L[q.c]}. ${q.o[q.c]}`;
    else if(wc)ah=`<span class="tg ct2">CORRECT</span> ${L[a]}. ${q.o[a]}`;
    else ah=`<span class="tg wt">WRONG</span> You: ${L[a]}. ${q.o[a]} — Correct: ${L[q.c]}. ${q.o[q.c]}`;
    const d=document.createElement("div");d.className=`rvi ${cls}`;
    d.innerHTML=`<div class="rvq">Q${i+1}. ${q.q} <span style="font-weight:400;font-size:.72rem;color:var(--tm)">[${q.sub}]</span></div><div class="rva">${ah}</div><div class="rve">${q.e}</div>`;
    rl.appendChild(d);
  });
  $("rvs").classList.add("hd");
}
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));$(id).classList.add("active");window.scrollTo({top:0,behavior:"smooth"});}
function goHome(){S.sel=[];document.querySelectorAll(".sc").forEach(c=>c.classList.remove("sel"));updBtn();show("home-screen");}
init();
</script>
</body>
</html>
